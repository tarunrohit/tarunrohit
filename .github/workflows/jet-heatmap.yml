name: Update Jet Heatmap

on:
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs slightly under load.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_heatmap.py"
      - ".github/workflows/jet-heatmap.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate heatmap SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_LOGIN: tarunrohit
        run: python3 scripts/generate_heatmap.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/github-jet-dark.svg dist/github-jet-light.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution heatmap [skip ci]"
          git push
